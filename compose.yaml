
services:
  backend:
    build:
      context: "./Codigo del prototipo"
      dockerfile: Dockerfile
    container_name: coffees-medy-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - "./Codigo del prototipo/.env"
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: host.docker.internal
      PGPORT: 5432
      PGDATABASE: DB_CoffeesMedy
      PGUSER: postgres
      PGSSL: "false"
