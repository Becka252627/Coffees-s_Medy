
services:
  backend:
    build:
      context: "./Codigo del prototipo"
      dockerfile: Dockerfile
    container_name: coffees-medy-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_SERVER: host.docker.internal
      DB_PORT: 1433
      DB_NAME: DB_CoffeesMedy
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
